name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Pinned: Playwright 1.56.1 (pinned for the E2E) cannot install Chromium on
    # ubuntu-latest once it resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Repository/service/AI tests against both Miniflare D1 and libSQL,
      # including applying every migration to an empty database.
      - run: npm test
      - run: npm run build:vercel
      # The Sites Worker must bundle lib/platform/sites.ts, never the Vercel runtime.
      - run: npm run build
      - run: node scripts/check-sites-bundle.mjs
      # Browser scenario on the built Sites Worker with a fresh local D1.
      - run: npx playwright install --with-deps chromium
      - run: scripts/e2e/run.sh --no-build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            .qa/shots
            .qa/server.log
          retention-days: 7
