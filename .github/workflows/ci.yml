name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Repository/service/AI tests against both Miniflare D1 and libSQL,
      # including applying every migration to an empty database.
      - run: npm test
      - run: npm run build:vercel
      # The Sites Worker must bundle lib/platform/sites.ts, never the Vercel runtime.
      - run: npm run build
      - run: node scripts/check-sites-bundle.mjs
